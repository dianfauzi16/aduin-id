<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Aduin.id</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* Gaya Khusus Halaman Login */
      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        background-color: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 1;
        opacity: 0.6;
      }
      .blob-1 {
        width: 400px;
        height: 400px;
        background: rgba(37, 99, 235, 0.2);
        top: -100px;
        left: -100px;
      }
      .blob-2 {
        width: 300px;
        height: 300px;
        background: rgba(147, 51, 234, 0.2);
        bottom: -50px;
        right: -50px;
      }
      .login-wrapper {
        width: 100%;
        max-width: 420px;
        padding: 20px;
        position: relative;
        z-index: 10;
      }
      .login-card {
        background: #1e293b;
        border-radius: 24px;
        padding: 48px 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid #334155;
      }
      .login-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        margin-bottom: 32px;
      }
      .login-logo-icon {
        background: #2563eb;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-logo-icon svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .login-logo-text {
        font-family: "Sora", sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #f8fafc;
      }
      .login-logo-text span {
        color: #2563eb;
      }
      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .login-title {
        font-family: "Sora", sans-serif;
        font-size: 24px;
        font-weight: 600;
        color: #f8fafc;
        margin: 0 0 8px;
      }
      .login-sub {
        color: #94a3b8;
        font-size: 15px;
        margin: 0;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-label {
        display: block;
        font-weight: 500;
        color: #94a3b8;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .form-input {
        width: 100%;
        padding: 14px 16px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        color: #f8fafc;
        box-sizing: border-box;
        transition: all 0.2s;
      }
      .form-input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      }
      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
        font-size: 14px;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #94a3b8;
        cursor: pointer;
      }
      .forgot-link {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
      }
      .forgot-link:hover {
        text-decoration: underline;
      }
      .btn-submit {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 12px;
        font-family: "DM Sans", sans-serif;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-submit:hover {
        background: #1d4ed8;
      }
      .login-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 15px;
        color: #64748b;
      }
      .login-footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
      .login-footer a:hover {
        text-decoration: underline;
      }
      @media (max-width: 768px) {
        body {
          align-items: flex-start;
          padding: 80px 20px 20px;
        }
        .back-to-home {
          top: 24px;
          left: 24px;
          font-size: 14px;
        }
        .login-card {
          padding: 40px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="login-wrapper">
      <div class="login-card">
        <a href="index.html" class="login-logo">
          <div class="login-logo-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <span class="login-logo-text">Aduin<span>.id</span></span>
        </a>
        <div class="login-header">
          <h1 class="login-title">Hallo Admin</h1>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Alamat Email</label>
            <input
              type="email"
              class="form-input"
              placeholder="admin@institusi.go.id"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-input"
              placeholder="••••••••"
              required
            />
          </div>
          <div class="form-options">
            <label class="checkbox-label"
              ><input type="checkbox" /> Ingat saya</label
            >
          </div>
          <button type="submit" class="btn-submit">Masuk Sekarang</button>
        </form>
      </div>
    </div>

    <script>
      document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault(); // Mencegah form melakukan refresh halaman
        
        // Ambil nilai email dan password
        const email = this.querySelector('input[type="email"]').value;
        const password = this.querySelector('input[type="password"]').value;
        
        // Cek kecocokan (Kredensial hardcode tanpa database)
        if (email === "admin@aduin.id" && password === "admin123") {
          // Simpan sesi login di browser
          sessionStorage.setItem("adminLoggedIn", "true");
          // Arahkan ke halaman admin
          window.location.href = "admin.html";
        } else {
          alert("Email atau password salah!");
        }
      });
    </script>
  </body>
</html>
